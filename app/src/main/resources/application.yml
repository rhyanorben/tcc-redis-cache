spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  application:
    name: tcc-pedidos
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${DB_URL:jdbc:postgresql://10.10.10.20:5432/tcc?currentSchema=tcc}
    username: ${DB_USER:tcc_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
      data-source-properties:
        options: -c statement_timeout=10000
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    schemas: tcc
    default-schema: tcc
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    time-zone: UTC

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cache:
    enabled: ${CACHE_ENABLED:false}
    namespace: ${CACHE_NAMESPACE:tcc:v1}
    ttl: ${CACHE_TTL:60s}
    timeout: ${CACHE_TIMEOUT:200ms}
    host: ${REDIS_HOST:10.10.10.30}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USER:app}
    password: ${REDIS_PASSWORD:}
