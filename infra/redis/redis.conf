# Bind interno ao contêiner; a publicação Docker usa apenas o IP da VM.
bind 0.0.0.0
protected-mode yes
port 6379
aclfile /tmp/tcc-users.acl
daemonize no
logfile ""
# Cache descartável: reiniciar começa um cache frio.
save ""
appendonly no
# Ponto de partida; revisar conforme a memória real da VM.
maxmemory 256mb
maxmemory-policy allkeys-lru
