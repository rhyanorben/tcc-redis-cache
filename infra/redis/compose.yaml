name: tcc-redis

services:
  redis:
    image: ${REDIS_IMAGE:?Defina REDIS_IMAGE no .env}
    restart: unless-stopped
    entrypoint: [/bin/sh, /usr/local/bin/start-redis.sh]
    command: []
    environment:
      TZ: UTC
    ports:
      - "${REDIS_BIND_IP:?Defina REDIS_BIND_IP}:6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./start-redis.sh:/usr/local/bin/start-redis.sh:ro
    secrets:
      - redis_password
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --no-auth-warning ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  redis_password:
    file: ./secrets/redis_password.txt
